determine_domain:
  agent: math_teacher
  description: |
    Given a question: {question_content}.
    
    Analyze and extract the provided images and text from the given content.
      - Categorize question under its respective content domain under these domains: {algebra}, {geometry}, {statistics}
      - If the domain is unclear, categorize it as "Unknown".
  expected_output: |
    Extract the question in the following format:
      - Domain: <the mathematics domain of the question>
      - Question: <the question content from the output image or given text>
      - Image path: <the path to the image of the question if have>